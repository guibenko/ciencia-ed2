<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Estágio Docência II — registrando ciência</title>
<!--
  Página-ponte do link de ciência do orientador (Estágio Docência II · UFT).
  Motivo: com mais de uma conta Google aberta no navegador, o Google troca o
  endereço do app por /macros/u/1/... e mostra "Não foi possível abrir o arquivo".
  Vindo de um endereço fora do Google, o navegador abre o /exec correto.
  Esta página não guarda nem envia dados: só repassa ?ciencia=...&tipo=... ao app.
  Aceita também o formato antigo ?c=... ("c" é nome reservado do Apps Script e era barrado).
-->
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbySI7M_-9BgO5kE0lZK99rKFk5tfPOyB96jOJ8uPrJFcTaMgmoCRgxIPJNK_6KQWRs-9g/exec';
  var m = location.search.match(/^\?(?:ciencia|c)=([0-9a-f]{32})&tipo=(plano|final)$/);
  var valido = !!m;
  var q = valido ? '?ciencia=' + m[1] + '&tipo=' + m[2] : '';
  if (valido) location.replace(APP + q);
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #F4F6FA; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #14213D; }
  .card { max-width: 30rem; margin: 1rem; padding: 2rem 1.6rem; background: #fff; border: 1px solid #D6DDE8;
          border-radius: 14px; text-align: center; box-shadow: 0 6px 24px rgba(20,33,61,.08); }
  .spin { width: 36px; height: 36px; margin: 0 auto 1rem; border: 4px solid #E4E9F1; border-top-color: #E6A817;
          border-radius: 50%; animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  a { color: #14213D; font-weight: 600; }
  small { color: #6B7690; }
</style>
</head>
<body>
  <div class="card">
    <div class="spin" id="spin"></div>
    <h1 style="font-size:1.25rem;margin:0 0 .5rem" id="titulo">Registrando sua ciência…</h1>
    <p style="margin:0 0 1rem" id="texto">Aguarde um instante; você será levado(a) à página de confirmação.</p>
    <p style="margin:0"><a id="link" href="#">Se a página não abrir sozinha, clique aqui</a></p>
    <p style="margin:1.2rem 0 0"><small>Estágio Docência II · Mestrado Agroenergia Digital — UFT</small></p>
  </div>
  <script>
    if (valido) {
      document.getElementById('link').href = APP + q;
    } else {
      document.getElementById('spin').style.display = 'none';
      document.getElementById('titulo').textContent = 'Link incompleto';
      document.getElementById('texto').textContent =
        'Este endereço não está completo. Abra novamente o botão "Estou de acordo" do e-mail recebido.';
      document.getElementById('link').style.display = 'none';
    }
  </script>
  <noscript><p style="text-align:center">Ative o JavaScript ou use o endereço em texto que veio no e-mail.</p></noscript>
</body>
</html>
